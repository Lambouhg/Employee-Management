<div 
  class="relative p-2.5 rounded-lg border-2 shadow-sm hover:shadow-md transition-all duration-200 cursor-pointer"
  [ngClass]="getCardClasses()"
  (click)="onEdit()">
  
  <!-- Delete Button (Top-right corner) -->
  <button 
    *ngIf="canEdit"
    type="button"
    class="absolute top-1.5 right-1.5 p-1 rounded-full transition-colors"
    [ngClass]="getDeleteButtonClasses()"
    (click)="onDelete($event)"
    title="Delete shift">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
    </svg>
  </button>

  <!-- Shift Type Badge -->
  <div class="flex items-center justify-between mb-2">
    <span 
      class="inline-flex px-2 py-0.5 text-[10px] font-bold rounded-full"
      [ngClass]="getBadgeClasses()">
      {{ getShiftTypeLabel() }}
    </span>
  </div>

  <!-- Time Range -->
  <div class="flex items-center mb-2 text-gray-700">
    <svg class="w-3 h-3 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <span class="text-xs font-semibold">
      {{ formatTime(shift.startTime) }} - {{ formatTime(shift.endTime) }}
    </span>
  </div>

  <!-- Part-time Capacity -->
  <div class="space-y-1.5">
    <div class="flex items-center justify-between text-xs">
      <span class="text-gray-600 font-medium">Part-time:</span>
      <span class="font-bold text-gray-800">
        {{ shift.ptRegistered }}/{{ shift.ptCapacity }}
      </span>
    </div>
    
    <!-- Progress Bar -->
    <div class="w-full bg-gray-200 rounded-full h-1.5 overflow-hidden">
      <div 
        class="h-1.5 rounded-full transition-all duration-300"
        [ngClass]="{
          'bg-green-500': getRegistrationPercentage() >= 100,
          'bg-yellow-500': getRegistrationPercentage() >= 70 && getRegistrationPercentage() < 100,
          'bg-blue-500': getRegistrationPercentage() >= 30 && getRegistrationPercentage() < 70,
          'bg-red-500': getRegistrationPercentage() < 30
        }"
        [style.width.%]="getRegistrationPercentage()">
      </div>
    </div>
    
    <!-- Status Badge -->
    <div class="text-[10px]" *ngIf="shift.ptRegistered >= shift.ptCapacity">
      <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-green-800 bg-green-100">
        <svg class="w-2.5 h-2.5 mr-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
        </svg>
        Fully Staffed
      </span>
    </div>
    <div class="text-[10px]" *ngIf="shift.ptRegistered < shift.ptCapacity">
      <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-orange-800 bg-orange-100">
        <svg class="w-2.5 h-2.5 mr-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        {{ shift.ptCapacity - shift.ptRegistered }} spots left
      </span>
    </div>
  </div>

  <!-- Notes (if any) -->
  <div *ngIf="shift.notes" class="mt-2 pt-2 border-t border-gray-200">
    <p class="text-[10px] text-gray-600 italic line-clamp-2">{{ shift.notes }}</p>
  </div>

  <!-- Edit Indicator (only show on hover if can edit) -->
  <div *ngIf="canEdit" class="mt-2 pt-2 border-t border-gray-200">
    <div class="flex items-center justify-center text-[10px] text-gray-500">
      <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
      </svg>
      <span>Click to edit</span>
    </div>
  </div>
</div>
