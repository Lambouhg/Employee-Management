<div class="min-h-screen bg-gradient-to-br from-gray-50 via-blue-50 to-indigo-50">
  <!-- Creating Mode Loading -->
  <ng-container *ngIf="isCreatingMode">
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <svg class="animate-spin h-12 w-12 text-indigo-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-600 font-bold">Đang tạo schedule mới...</p>
      </div>
    </div>
  </ng-container>

  <!-- Normal Mode with Async Pipe -->
  <ng-container *ngIf="!isCreatingMode">
    <!-- Main Content with Async Pipe -->
    <ng-container *ngIf="schedule$ | async as schedule; else loading">
    <!-- Header Component -->
    <app-schedule-header
      [status]="schedule.status"
      [weekStartDate]="schedule.weekStartDate"
      [weekEndDate]="getWeekEndDate(schedule)"
      [canPublish]="canPublish(schedule)"
      [isPublishing]="isPublishing"
      [isLocking]="isLocking"
      (publish)="publishSchedule(schedule)"
      (lock)="lockSchedule()">
    </app-schedule-header>

    <!-- Alert Messages -->
    <div class="max-w-7xl mx-auto px-4 py-2">
      <app-alert-message
        *ngIf="errorMessage"
        [message]="errorMessage"
        [type]="'error'"
        (close)="errorMessage = ''">
      </app-alert-message>
      
      <app-alert-message
        *ngIf="successMessage"
        [message]="successMessage"
        [type]="'success'"
        (close)="successMessage = ''">
      </app-alert-message>
    </div>

    <!-- Calendar Component -->
    <div class="max-w-7xl mx-auto px-4 pb-6">
      <app-schedule-calendar
        [weekDays]="getWeekDays(schedule)"
        [shifts]="schedule.shiftOpenings || []"
        [canEdit]="canEdit(schedule)"
        [totalShifts]="schedule.shiftOpenings?.length || 0"
        (addShift)="resetShiftForm(schedule); showShiftForm = true"
        (quickAddShift)="quickAddShift($event, schedule)"
        (viewDetail)="viewShiftDetail($event)"
        (deleteShift)="deleteShift($event)">
      </app-schedule-calendar>
    </div>
  </ng-container>

  <!-- Loading Template -->
  <ng-template #loading>
    <div class="flex items-center justify-center min-h-screen">
      <div class="text-center">
        <svg class="animate-spin h-12 w-12 text-indigo-600 mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="text-gray-600 font-bold">Loading schedule...</p>
      </div>
    </div>
  </ng-template>

  <!-- Error State -->
  <div *ngIf="errorMessage && !(schedule$ | async)" class="flex items-center justify-center min-h-screen">
    <div class="text-center max-w-md">
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <h3 class="text-xl font-black text-gray-900 mb-2">Unable to Load Schedule</h3>
      <p class="text-gray-600 mb-6">{{ errorMessage }}</p>
      <a routerLink="/dept-manager/schedules" class="inline-flex items-center gap-2 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Back to List
      </a>
    </div>
  </div>
  </ng-container>
</div>

<!-- Shift Form Modal Component -->
<ng-container *ngIf="!isCreatingMode">
  <app-shift-form-modal
    *ngIf="schedule$ | async as schedule"
    [isOpen]="showShiftForm"
    [formData]="shiftForm"
    [availableDates]="getAvailableDates(schedule)"
    [isEditMode]="!!editingShift"
    [isSaving]="isSaving"
    (save)="saveShift($event)"
    (cancel)="closeShiftForm()">
  </app-shift-form-modal>

  <!-- Shift Detail Modal Component -->
  <app-shift-detail-modal
    [shift]="viewingShift"
    [show]="showShiftDetail"
    (close)="closeShiftDetail()">
  </app-shift-detail-modal>
</ng-container>
